<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9dfd0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pearl Loom" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./game.wasm" as="fetch" crossorigin />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <title>Pearl Loom — Raytraced Pearl Embroidery</title>
  </head>
  <body>
    <main id="app">
      <canvas id="gpu-canvas" aria-label="Pearl Loom Raytraced Atelier"></canvas>

      <header class="hud-top" aria-label="Pattern Status">
        <div class="hud-group">
          <button id="btn-pattern" class="pill pill-btn" type="button" aria-label="Open Pattern Gallery">
            <span id="hud-pattern-name" class="pattern-name">Rose Heart</span>
            <span id="hud-progress" class="pill-value">0 / 9</span>
            <span class="caret" aria-hidden="true">▾</span>
          </button>
        </div>

        <div class="hud-group">
          <div id="hud-active-swatches" class="pill swatch-pill" aria-label="Active Stitch Colors">
            <span id="swatch-caption" class="swatch-caption">STITCH</span>
            <div id="swatch-list" class="swatch-list"></div>
          </div>
          <button
            id="btn-audio"
            class="pill pill-btn icon-pill"
            type="button"
            aria-label="Toggle Sound"
            aria-pressed="false"
          >
            <span id="audio-icon" aria-hidden="true">♪</span>
          </button>
        </div>
      </header>

      <footer class="hud-bottom" aria-label="Craft Controls">
        <button id="btn-undo" class="pill pill-btn control-btn" type="button" aria-label="Undo last move" disabled>
          <span class="btn-icon" aria-hidden="true">↶</span>
          <span>Undo</span>
        </button>
        <button id="btn-hint" class="pill pill-btn control-btn" type="button" aria-label="Show gentle hint">
          <span class="btn-icon" aria-hidden="true">✦</span>
          <span>Hint</span>
        </button>
        <button id="btn-reset" class="pill pill-btn control-btn" type="button" aria-label="Restart pattern">
          <span class="btn-icon" aria-hidden="true">↻</span>
          <span>Restart</span>
        </button>
      </footer>

      <section id="overlay-gallery" class="gallery-sheet hidden" role="dialog" aria-label="Atelier Pattern Gallery">
        <div class="gallery-header">
          <div>
            <p class="modal-eyebrow">ATELIER COLLECTION</p>
            <h2 class="gallery-title">Pearl Gallery</h2>
          </div>
          <button id="btn-close-gallery" class="pill pill-btn icon-pill" type="button" aria-label="Close Gallery">
            ✕
          </button>
        </div>

        <div class="gallery-special-row">
          <button id="btn-daily-stitch" class="gallery-special-card" type="button">
            <span class="special-tag">TODAY</span>
            <strong>Daily Stitch</strong>
            <span id="daily-status" class="gallery-meta">Fresh calendar mandala</span>
          </button>
          <button id="btn-endless-mandala" class="gallery-special-card" type="button">
            <span class="special-tag">ENDLESS</span>
            <strong>New Mandala</strong>
            <span id="mandala-status" class="gallery-meta">0 stitched</span>
          </button>
        </div>

        <div id="gallery-grid" class="gallery-grid" aria-label="Curated Embroidery Patterns"></div>
      </section>

      <section id="overlay-tray-full" class="modal-card hidden" role="dialog" aria-label="Silk Tray Full">
        <h2 class="modal-title">Silk tray is full</h2>
        <p class="modal-copy">No rush — step back a move or start this pattern fresh.</p>
        <div class="modal-actions">
          <button id="btn-tray-undo" class="modal-btn modal-btn-primary" type="button">Undo Move</button>
          <button id="btn-tray-restart" class="modal-btn" type="button">Restart</button>
        </div>
      </section>

      <section id="overlay-complete" class="modal-card hidden" role="dialog" aria-label="Pattern Complete">
        <p class="modal-eyebrow">EMBROIDERY COMPLETE</p>
        <h2 id="complete-title" class="modal-title">Rose Heart</h2>
        <p id="complete-stats" class="modal-copy">Stitched calmly in 9 moves · Saved to Gallery.</p>
        <div class="modal-actions">
          <button id="btn-next-level" class="modal-btn modal-btn-primary" type="button">Next Pattern</button>
          <button id="btn-replay-level" class="modal-btn" type="button">Stitch Again</button>
        </div>
      </section>

      <div id="fallback-banner" class="fallback hidden" role="alert">
        <h1>WebGPU Required</h1>
        <p id="fallback-message">
          Pearl Loom uses hardware-accelerated WebGPU raytracing (Safari 26+ on iPhone 16).
        </p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
