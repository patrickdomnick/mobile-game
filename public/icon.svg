  <circle cx="256" cy="264" r="176" fill="#f9f3ea" stroke="url(#brass)" stroke-width="26"/>
  <!-- Shimmering raytraced-style pearl heart bouquet -->
  <circle cx="204" cy="212" r="34" fill="url(#rose)"/>
  <circle cx="308" cy="212" r="34" fill="url(#rose)"/>
  <circle cx="164" cy="264" r="32" fill="url(#rose)"/>
  <circle cx="348" cy="264" r="32" fill="url(#rose)"/>
  <circle cx="256" cy="242" r="33" fill="url(#ivory)"/>
  <circle cx="256" cy="300" r="30" fill="url(#ivory)"/>
  <circle cx="204" cy="316" r="30" fill="url(#honey)"/>
  <circle cx="308" cy="316" r="30" fill="url(#sage)"/>
  <circle cx="256" cy="358" r="32" fill="url(#rose)"/>
