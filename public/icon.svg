<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="linen" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f7efe3"/>
      <stop offset="100%" stop-color="#ded0bc"/>
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3dfb6"/>
      <stop offset="50%" stop-color="#cfa968"/>
      <stop offset="100%" stop-color="#9e7639"/>
    </linearGradient>
    <radialGradient id="rose" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fff4f7"/>
      <stop offset="35%" stop-color="#f195ab"/>
      <stop offset="100%" stop-color="#ba536b"/>
    </radialGradient>
    <radialGradient id="ivory" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f7efe2"/>
      <stop offset="100%" stop-color="#c9bba8"/>
    </radialGradient>
    <radialGradient id="honey" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fff8e3"/>
      <stop offset="40%" stop-color="#f3c56b"/>
      <stop offset="100%" stop-color="#b87e28"/>
    </radialGradient>
    <radialGradient id="sage" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#f0fff7"/>
      <stop offset="40%" stop-color="#7ec4a0"/>
      <stop offset="100%" stop-color="#3e7c5d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#linen)"/>
  <!-- Brass hoop top clasp -->
  <rect x="230" y="54" width="52" height="30" rx="10" fill="url(#brass)"/>
