name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build TinyGo WASM & WebGPU PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pinned Go, TinyGo, and pnpm dependencies
        run: |
          bash scripts/setup-env.sh
          echo "$HOME/.local/toolchains/tinygo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/toolchains/go/bin" >> "$GITHUB_PATH"

      - name: Run fail-fast contract & shader guard
        run: pnpm check:contracts

      - name: Run Go simulation unit tests
        run: pnpm test:go

      - name: Run TypeScript/JS unit tests
        run: pnpm test:unit

      - name: Build TinyGo WebAssembly module
        run: pnpm build:wasm

      - name: Typecheck & Vite production build
        run: pnpm typecheck && pnpm exec vite build

      - name: Prepare GitHub Pages bundle
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy HTTPS Site to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
